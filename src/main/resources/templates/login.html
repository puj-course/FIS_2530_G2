<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LoginWave - Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #111;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background-color: #1c1c1c;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.4);
            text-align: center;
            width: 350px;
        }

        .login-box h2 {
            margin-bottom: 20px;
            font-size: 28px;
            color: #00bfff;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background-color: #333;
            color: white;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 25px;
            background-color: #00bfff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn:hover {
            background-color: white;
            color: black;
        }

        .error {
            color: #ff4d4d;
            margin-top: 10px;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            color: #ccc;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Iniciar Sesión</h2>

    <form th:action="@{/login}" method="post">
        <input type="text" name="nombreUsuario" placeholder="Nombre de usuario" required>
        <input type="password" name="contrasena" placeholder="Contraseña" required>
        <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <a th:href="@{/}" class="back-link">← Volver al inicio</a>
</div>
</body>
</html>

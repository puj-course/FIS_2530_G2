<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIS - Registro de Usuario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .registro-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 800px;
            width: 100%;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .registro-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .registro-header h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .registro-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .registro-body {
            padding: 40px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-danger {
            background-color: #fee;
            color: #c33;
            border-left: 4px solid #c33;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .required {
            color: #e74c3c;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background-color: #f8f9fa;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: #667eea;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-control.error, .form-select.error {
            border-color: #e74c3c;
        }

        .error-message {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 4px;
            display: block;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
            margin: 30px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #f0f0f0;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .registro-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
<div class="registro-container">
    <div class="registro-header">
        <h1>Registro de Usuario</h1>
        <p>Completa el formulario para crear tu cuenta</p>
    </div>

    <div class="registro-body">
        <!-- Mensaje de error general -->
        <div th:if="${error}" class="alert alert-danger">
            <strong>Error:</strong> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/registro}" th:object="${usuario}" method="post">

            <!-- SECCIÓN: CREDENCIALES -->
            <h3 class="section-title">Credenciales de Acceso</h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="username">Usuario <span class="required">*</span></label>
                    <input
                            type="text"
                            class="form-control"
                            th:classappend="${usernameError} ? 'error' : ''"
                            id="username"
                            th:field="*{username}"
                            placeholder="nombre.usuario"
                            required>
                    <span th:if="${usernameError}" class="error-message" th:text="${usernameError}"></span>
                    <span th:if="${#fields.hasErrors('username')}" class="error-message" th:errors="*{username}"></span>
                </div>

                <div class="form-group">
                    <label for="tipoUsuario">Tipo de Usuario <span class="required">*</span></label>
                    <select
                            class="form-select"
                            id="tipoUsuario"
                            th:field="*{tipoUsuario}"
                            required>
                        <option value="">Seleccione...</option>
                        <option th:each="tipo : ${tiposUsuario}"
                                th:value="${tipo}"
                                th:text="${tipo.displayName}">
                        </option>
                    </select>
                    <span th:if="${#fields.hasErrors('tipoUsuario')}" class="error-message" th:errors="*{tipoUsuario}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Contraseña <span class="required">*</span></label>
                    <input
                            type="password"
                            class="form-control"
                            th:classappend="${passwordError} ? 'error' : ''"
                            id="password"
                            th:field="*{password}"
                            placeholder="Mínimo 6 caracteres"
                            required>
                    <span th:if="${passwordError}" class="error-message" th:text="${passwordError}"></span>
                    <span th:if="${#fields.hasErrors('password')}" class="error-message" th:errors="*{password}"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña <span class="required">*</span></label>
                    <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            th:field="*{confirmPassword}"
                            placeholder="Repite la contraseña"
                            required>
                    <span th:if="${#fields.hasErrors('confirmPassword')}" class="error-message" th:errors="*{confirmPassword}"></span>
                </div>
            </div>

            <!-- SECCIÓN: INFORMACIÓN PERSONAL -->
            <h3 class="section-title">Información Personal</h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="nombres">Nombres <span class="required">*</span></label>
                    <input
                            type="text"
                            class="form-control"
                            id="nombres"
                            th:field="*{nombres}"
                            placeholder="Juan Carlos"
                            required>
                    <span th:if="${#fields.hasErrors('nombres')}" class="error-message" th:errors="*{nombres}"></span>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos <span class="required">*</span></label>
                    <input
                            type="text"
                            class="form-control"
                            id="apellidos"
                            th:field="*{apellidos}"
                            placeholder="Pérez García"
                            required>
                    <span th:if="${#fields.hasErrors('apellidos')}" class="error-message" th:errors="*{apellidos}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tipoDocumento">Tipo de Documento <span class="required">*</span></label>
                    <select
                            class="form-select"
                            id="tipoDocumento"
                            th:field="*{tipoDocumento}"
                            required>
                        <option value="">Seleccione...</option>
                        <option th:each="tipo : ${tiposDocumento}"
                                th:value="${tipo}"
                                th:text="${tipo}">
                        </option>
                    </select>
                    <span th:if="${#fields.hasErrors('tipoDocumento')}" class="error-message" th:errors="*{tipoDocumento}"></span>
                </div>

                <div class="form-group">
                    <label for="numeroDocumento">Número de Documento <span class="required">*</span></label>
                    <input
                            type="text"
                            class="form-control"
                            th:classappend="${numeroDocumentoError} ? 'error' : ''"
                            id="numeroDocumento"
                            th:field="*{numeroDocumento}"
                            placeholder="1234567890"
                            required>
                    <span th:if="${numeroDocumentoError}" class="error-message" th:text="${numeroDocumentoError}"></span>
                    <span th:if="${#fields.hasErrors('numeroDocumento')}" class="error-message" th:errors="*{numeroDocumento}"></span>
                </div>
            </div>

            <!-- SECCIÓN: INFORMACIÓN DE CONTACTO -->
            <h3 class="section-title">Información de Contacto</h3>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input
                            type="email"
                            class="form-control"
                            th:classappend="${emailError} ? 'error' : ''"
                            id="email"
                            th:field="*{email}"
                            placeholder="correo@ejemplo.com">
                    <span th:if="${emailError}" class="error-message" th:text="${emailError}"></span>
                    <span th:if="${#fields.hasErrors('email')}" class="error-message" th:errors="*{email}"></span>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input
                            type="text"
                            class="form-control"
                            id="direccion"
                            th:field="*{direccion}"
                            placeholder="Calle 123 #45-67">
                    <span th:if="${#fields.hasErrors('direccion')}" class="error-message" th:errors="*{direccion}"></span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Registrar Usuario</button>
            <a href="/login" class="btn btn-secondary">Cancelar</a>
        </form>

        <div class="login-link">
            ¿Ya tienes una cuenta? <a href="/login">Inicia sesión aquí</a>
        </div>
    </div>
</div>
</body>
</html>

# ============================================
# Archivo: src/test/resources/application-no-docker.properties
# ============================================

# Este perfil se usa cuando Docker NO está disponible en CI
# Usa H2 en memoria en lugar de PostgreSQL/MySQL

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# H2 Console (útil para debugging local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Desactivar Testcontainers
spring.test.database.replace=none

# Logging
logging.level.org.springframework=INFO
logging.level.sis=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# Archivo alternativo: src/test/resources/application-test.properties
# ============================================

# Configuración general para tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.level.org.springframework=WARN
logging.level.sis=INFO




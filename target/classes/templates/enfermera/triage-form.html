<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Triage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/enfermera/dashboard}">SIS - Enfermera</a>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">🩺 Registrar Triage</h1>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>

    <!-- Info del paciente -->
    <div class="card mb-3">
        <div class="card-header bg-info text-white">
            <h5 class="mb-0">Información del Paciente</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Nombre:</strong> <span th:text="${paciente.nombreCompleto}"></span></p>
                    <p><strong>Documento:</strong> <span th:text="${paciente.tipoDocumento + ' ' + paciente.numeroDocumento}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Edad:</strong> <span th:text="${paciente.edad + ' años'}"></span></p>
                    <p><strong>Seguro:</strong> <span th:text="${paciente.seguro}"></span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Formulario de triage -->
    <div class="card">
        <div class="card-body">
            <form th:action="@{/enfermera/triage}"
                  th:object="${triageForm}"
                  method="post">

                <input type="hidden" th:field="*{ticketId}" />

                <!-- Síntomas -->
                <div class="mb-3">
                    <label for="sintomas" class="form-label">
                        Síntomas <span class="text-danger">*</span>
                    </label>
                    <textarea id="sintomas"
                              th:field="*{sintomas}"
                              class="form-control"
                              rows="4"
                              placeholder="Describe los síntomas principales del paciente"
                              required></textarea>
                </div>

                <h5 class="mt-4 mb-3">Signos Vitales</h5>

                <div class="row">
                    <!-- Temperatura -->
                    <div class="col-md-6 mb-3">
                        <label for="temperaturaC" class="form-label">
                            Temperatura (°C) <span class="text-danger">*</span>
                        </label>
                        <input type="number"
                               step="0.1"
                               id="temperaturaC"
                               th:field="*{temperaturaC}"
                               class="form-control"
                               placeholder="36.5"
                               required />
                    </div>

                    <!-- Frecuencia Cardíaca -->
                    <div class="col-md-6 mb-3">
                        <label for="frecuenciaCardiaca" class="form-label">
                            Frecuencia Cardíaca (lpm) <span class="text-danger">*</span>
                        </label>
                        <input type="number"
                               id="frecuenciaCardiaca"
                               th:field="*{frecuenciaCardiaca}"
                               class="form-control"
                               placeholder="70"
                               required />
                    </div>
                </div>

                <div class="row">
                    <!-- Presión Sistólica -->
                    <div class="col-md-4 mb-3">
                        <label for="presionSistolica" class="form-label">
                            Presión Sistólica (mmHg) <span class="text-danger">*</span>
                        </label>
                        <input type="number"
                               id="presionSistolica"
                               th:field="*{presionSistolica}"
                               class="form-control"
                               placeholder="120"
                               required />
                    </div>

                    <!-- Presión Diastólica -->
                    <div class="col-md-4 mb-3">
                        <label for="presionDiastolica" class="form-label">
                            Presión Diastólica (mmHg) <span class="text-danger">*</span>
                        </label>
                        <input type="number"
                               id="presionDiastolica"
                               th:field="*{presionDiastolica}"
                               class="form-control"
                               placeholder="80"
                               required />
                    </div>

                    <!-- Saturación O2 -->
                    <div class="col-md-4 mb-3">
                        <label for="saturacionO2" class="form-label">
                            Saturación O₂ (%) <span class="text-danger">*</span>
                        </label>
                        <input type="number"
                               id="saturacionO2"
                               th:field="*{saturacionO2}"
                               class="form-control"
                               placeholder="98"
                               required />
                    </div>
                </div>

                <!-- Prioridad (opcional, se calcula automáticamente) -->
                <div class="mb-3">
                    <label for="prioridad" class="form-label">
                        Nivel de Prioridad (opcional - se calculará automáticamente)
                    </label>
                    <select id="prioridad"
                            th:field="*{prioridad}"
                            class="form-select">
                        <option value="">Calcular automáticamente</option>
                        <option th:each="nivel : ${nivelesTriage}"
                                th:value="${nivel}"
                                th:text="${nivel}"></option>
                    </select>
                    <small class="text-muted">Si no seleccionas nada, se calculará automáticamente según los signos vitales</small>
                </div>

                <!-- Botones -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-success">
                        Guardar Triage
                    </button>
                    <a th:href="@{/enfermera/ticket/{id}(id=${ticket.id})}" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

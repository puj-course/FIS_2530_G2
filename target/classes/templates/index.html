<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginSIS</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
        }

        .logo img {
            width: 280px;
            height: auto;
        }

        .content {
            text-align: center;
        }

        .title {
            font-size: 36px;
            font-weight: bold;
        }

        .subtitle {
            margin: 10px 0 30px;
            font-size: 16px;
            color: #ccc;
        }

        a.btn {
            text-decoration: none;
            display: block;
            margin: 10px auto;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background-color: white;
            color: black;
            cursor: pointer;
            transition: 0.3s ease;
            width: 200px;
            text-align: center;
        }

        a.btn:hover {
            background-color: #00bfff;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <img src="/logo.png" alt="Wave Logo">
    </div>
    <div class="content">
        <div class="title">LoginSIS</div>
        <div class="subtitle">¡Surfea la base de datos con wave!</div>
        <a th:href="@{/login}" class="btn">Inicia Sesión</a>

    </div>
</div>
</body>
</html>

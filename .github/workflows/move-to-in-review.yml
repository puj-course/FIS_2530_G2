name: Move Closed Issue to Review

on:
  issues:
    types: [closed]

jobs:
  move-to-review:
    runs-on: ubuntu-latest
    steps:
      - name: Move issue to Review column
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            // ==============================
            // CONFIGURACIÓN
            // ==============================
            const projectNumber = 44;
            const organization = "puj-course";
            const targetStatus = "In review";

            // ==============================
            // 1️⃣ Obtener ID del proyecto y campos
            // ==============================
            const queryProject = `
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    title
                    fields(first: 50) {
                      nodes {
                        __typename
                        ... on ProjectV2Field {
                          id
                          name
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let projectData;
            try {
              projectData = await github.graphql(queryProject, { 
                org: organization, 
                number: projectNumber 
              });
            } catch (error) {
              core.setFailed(`❌ Error al obtener el proyecto: ${error.message}`);
              console.log("Asegúrate de que:");
              console.log("1. El GH_TOKEN tenga permiso 'project' (read:project)");
              console.log("2. El GH_TOKEN tenga acceso a la organización 'puj-course'");
              console.log("3. El número del proyecto (44) sea correcto");
              return;
            }
            
            const project = projectData.organization.projectV2;
            
            if (!project) {
              core.setFailed("❌ No se pudo encontrar el proyecto 44 en la organización puj-course.");
              return;
            }
            
            const projectId = project.id;
            console.log(`✅ Proyecto encontrado: ${project.title} (ID: ${projectId})`);

            // Buscar el campo Status
            const statusField = project.fields.nodes.find(
              f => f.name === "Status" && f.__typename === "ProjectV2SingleSelectField"
            );

            if (!statusField) {
              core.setFailed("❌ Campo 'Status' no encontrado en el proyecto.");
              console.log("Campos disponibles:", project.fields.nodes.map(f => `${f.name} (${f.__typename})`));
              return;
            }

            const reviewOption = statusField.options.find(o => o.name === targetStatus);
            if (!reviewOption) {
              core.setFailed(`❌ Opción '${targetStatus}' no encontrada en el campo Status.`);
              console.log("Opciones disponibles:", statusField.options.map(o => o.name));
              return;
            }
            
            console.log(`✅ Campo Status encontrado con opción '${targetStatus}'`);

            // ==============================
            // 2️⃣ Buscar el item del issue cerrado
            // ==============================
            const issueNodeId = context.payload.issue.node_id;

            const queryItem = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          __typename
                          ... on Issue {
                            id
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const itemsData = await github.graphql(queryItem, { projectId });

            const item = itemsData.node.items.nodes.find(
              i => i.content && i.content.id === issueNodeId
            );

            if (!item) {
              console.log("⚠️ Issue #" + context.payload.issue.number + " no está en el proyecto.");
              console.log("El issue debe estar agregado al proyecto para poder moverlo.");
              return;
            }
            
            console.log(`✅ Issue #${item.content.number} encontrado en el proyecto`);

            // ==============================
            // 3️⃣ Actualizar el campo 'Status' → "Review"
            // ==============================
            const mutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            await github.graphql(mutation, {
              projectId: projectId,
              itemId: item.id,
              fieldId: statusField.id,
              optionId: reviewOption.id
            });

            console.log(`✅ Issue #${item.content.number} movido a '${targetStatus}' exitosamente!`);
name: Move Issue to Done

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

jobs:
  move-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Get issue number
        id: extract
        run: |
          if [ "${{ github.event_name }}" == "issues" ]; then
            ISSUE=${{ github.event.issue.number }}
          else
            ISSUE=$(echo "${{ github.event.pull_request.body }}" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          fi
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT

      - name: Move issue to "Done"
        if: steps.extract.outputs.issue != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = ${{ steps.extract.outputs.issue }};
            const projectId = 'TU_PROJECT_ID';
            const statusFieldId = 'TU_STATUS_FIELD_ID';
            await github.graphql(`
              mutation {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: "${projectId}",
                    itemId: "${issue_number}",
                    fieldId: "${statusFieldId}",
                    value: { singleSelectOptionId: "ID_DONE" }
                  }
                ) { clientMutationId }
              }
            `);

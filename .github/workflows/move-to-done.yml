name: Move Issue to Done

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - develop

jobs:
  move-issue:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Extract issue number from PR
        id: extract
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          # Prioridad 1: Buscar "Closes #<número>" en el cuerpo o título
          ISSUE=$(echo "$PR_TITLE $PR_BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | head -1)
          
          # Prioridad 2: Buscar #<número> en el nombre de la rama (feature/#23-name)
          if [ -z "$ISSUE" ]; then
            ISSUE=$(echo "$PR_BRANCH" | grep -oE '#[0-9]+' | tr -d '#' | head -1)
          fi
          
          # Prioridad 3: Buscar cualquier número en el nombre de la rama
          if [ -z "$ISSUE" ]; then
            ISSUE=$(echo "$PR_BRANCH" | grep -oE '[0-9]+' | head -1)
          fi
          
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT
          
          if [ -n "$ISSUE" ]; then
            echo "✅ Issue detectado: #$ISSUE"
          else
            echo "⚠️ No se detectó ningún issue en el PR"
          fi
          
      - name: Move issue to "Done"
        if: steps.extract.outputs.issue != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const issueNumber = ${{ steps.extract.outputs.issue }};
            const projectNumber = 44;
            const organization = "puj-course";
            const targetStatus = "Done";

            console.log(`🎯 Procesando issue #${issueNumber} tras merge del PR #${context.payload.pull_request.number}`);

            // ==============================
            // 1️⃣ Obtener ID del proyecto y campos
            // ==============================
            const queryProject = `
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    title
                    fields(first: 50) {
                      nodes {
                        __typename
                        ... on ProjectV2Field {
                          id
                          name
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectData = await github.graphql(queryProject, { 
              org: organization, 
              number: projectNumber 
            });
            
            const project = projectData.organization.projectV2;
            const projectId = project.id;
            console.log(`✅ Proyecto encontrado: ${project.title}`);

            // Buscar el campo Status
            const statusField = project.fields.nodes.find(
              f => f.name === "Status" && f.__typename === "ProjectV2SingleSelectField"
            );

            if (!statusField) {
              core.setFailed("❌ Campo 'Status' no encontrado.");
              return;
            }

            const doneOption = statusField.options.find(o => o.name === targetStatus);
            if (!doneOption) {
              core.setFailed(`❌ Opción '${targetStatus}' no encontrada.`);
              console.log("Opciones disponibles:", statusField.options.map(o => o.name));
              return;
            }

            // ==============================
            // 2️⃣ Obtener el node_id del issue
            // ==============================
            let issueData;
            try {
              issueData = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
            } catch (error) {
              core.setFailed(`❌ No se pudo obtener el issue #${issueNumber}: ${error.message}`);
              return;
            }
            
            const issueNodeId = issueData.data.node_id;

            // ==============================
            // 3️⃣ Buscar el item en el proyecto
            // ==============================
            const queryItem = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          __typename
                          ... on Issue {
                            id
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const itemsData = await github.graphql(queryItem, { projectId });

            const item = itemsData.node.items.nodes.find(
              i => i.content && i.content.id === issueNodeId
            );

            if (!item) {
              console.log(`⚠️ Issue #${issueNumber} no está en el proyecto.`);
              console.log("El issue debe estar agregado al tablero para poder moverlo.");
              return;
            }

            // ==============================
            // 4️⃣ Actualizar el estado a "Done"
            // ==============================
            const mutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            await github.graphql(mutation, {
              projectId: projectId,
              itemId: item.id,
              fieldId: statusField.id,
              optionId: doneOption.id
            });

            console.log(`✅ Issue #${issueNumber} movido a '${targetStatus}' tras merge del PR!`);
            
            // Opcional: Cerrar el issue automáticamente
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
            
            console.log(`✅ Issue #${issueNumber} cerrado automáticamente.`);
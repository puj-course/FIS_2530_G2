name: Move Issue to In Review

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - develop

jobs:
  move-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Extract issue number from PR body or title
        id: extract
        run: |
          ISSUE=$(echo "${{ github.event.pull_request.body }}${{ github.event.pull_request.title }}" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT

      - name: Move issue to "In Review"
        if: steps.extract.outputs.issue != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = ${{ steps.extract.outputs.issue }};
            const projectId = 'TU_PROJECT_ID';
            const statusFieldId = 'TU_STATUS_FIELD_ID';
            await github.graphql(`
              mutation {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: "${projectId}",
                    itemId: "${issue_number}",
                    fieldId: "${statusFieldId}",
                    value: { singleSelectOptionId: "ID_IN_REVIEW" }
                  }
                ) { clientMutationId }
              }
            `);

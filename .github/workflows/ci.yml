name: CI - Build and Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    name: Build and Test Spring Boot Application
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 📦 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 🔍 Validate Maven project
        run: mvn validate

      - name: 🧹 Clean previous builds
        run: mvn clean

      - name: 🔨 Compile project
        run: mvn compile

      - name: 🧪 Run tests
        run: mvn test -Dspring.profiles.active=no-docker
        continue-on-error: true
        env:
          DOCKER_AVAILABLE: false

      - name: 📊 Check for test reports
        if: always()
        id: check_reports
        shell: bash
        run: |
          echo "🔍 Searching for test reports..."
          if [ -d "target/surefire-reports" ]; then
            TEST_COUNT=$(find target/surefire-reports -name 'TEST-*.xml' 2>/dev/null | wc -l)
            echo "Found $TEST_COUNT test report files"
            if [ "$TEST_COUNT" -gt 0 ]; then
              echo "reports_exist=true" >> $GITHUB_OUTPUT
              echo "✅ Test reports found"
              ls -la target/surefire-reports/
            else
              echo "reports_exist=false" >> $GITHUB_OUTPUT
              echo "⚠️ No TEST-*.xml files in surefire-reports"
            fi
          else
            echo "reports_exist=false" >> $GITHUB_OUTPUT
            echo "⚠️ target/surefire-reports directory not found"
          fi

      - name: 📊 Generate test report
        if: always() && steps.check_reports.outputs.reports_exist == 'true'
        uses: dorny/test-reporter@v1
        with:
          name: Test Results (${{ matrix.os }})
          path: 'target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: 📦 Package application
        run: mvn package -DskipTests

      - name: 🔍 Verify build artifacts
        shell: bash
        run: |
          echo "📂 Contents of target directory:"
          ls -lh target/ || echo "No target directory"
          echo ""
          if ls target/*.jar 1> /dev/null 2>&1; then
            echo "✅ JAR files found:"
            ls -lh target/*.jar
          else
            echo "❌ No JAR files found in target/"
            exit 1
          fi

      - name: 🔍 Run code quality checks
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Running verify..."
          mvn verify -DskipTests || echo "⚠️ Verify step had issues, continuing..."
          echo "Running checkstyle..."
          mvn checkstyle:checkstyle || echo "⚠️ Checkstyle had issues, continuing..."
        continue-on-error: true

      - name: 📤 Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.os }}
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
            !target/original-*.jar
          retention-days: 7
          if-no-files-found: error

      - name: 📈 Upload coverage reports
        if: matrix.os == 'ubuntu-latest' && hashFiles('target/site/jacoco/jacoco.xml') != ''
        uses: codecov/codecov-action@v4
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: 💬 Comment PR with build status
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const buildStatus = '${{ job.status }}';
            const testsPassed = '${{ steps.check_reports.outputs.reports_exist }}' === 'true';
            const emoji = buildStatus === 'success' ? '✅' : '❌';
            const testEmoji = testsPassed ? '✅' : '⚠️';
            
            const comment = `## ${emoji} Build Status - CI Pipeline
            
            **Status:** ${buildStatus}
            **Java Version:** JDK 21
            **Framework:** Spring Boot
            **OS:** ${{ matrix.os }}
            **Commit:** ${context.sha.substring(0, 7)}
            **Branch:** ${context.payload.pull_request.head.ref}
            
            ### Build Steps:
            - ✅ Checkout code
            - ✅ Setup JDK 21
            - ${buildStatus === 'success' ? '✅' : '❌'} Compile project
            - ${testEmoji} Run tests ${testsPassed ? '(tests executed)' : '(no tests or tests skipped)'}
            - ${buildStatus === 'success' ? '✅' : '❌'} Package application
            
            ### Artifacts:
            - ${buildStatus === 'success' ? '✅ JAR file created' : '❌ Build failed'}
            
            [View full workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;
            
            try {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: comment
              });
            } catch (error) {
              console.log('Could not create comment:', error.message);
            }

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 🔍 SonarCloud Scan
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "Running SonarCloud analysis..."
            mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.projectKey=puj-course_FIS_2530_G2 \
              -Dsonar.organization=puj-course \
              -Dsonar.host.url=https://sonarcloud.io
          else
            echo "⚠️ SONAR_TOKEN not set, skipping SonarCloud scan"
          fi
        continue-on-error: true

      - name: 📊 Generate dependency tree
        run: mvn dependency:tree -DoutputFile=dependency-tree.txt

      - name: 📤 Upload dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: dependency-tree.txt
          retention-days: 30

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 🔒 Run OWASP Dependency Check
        run: |
          echo "Running OWASP Dependency Check..."
          mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        continue-on-error: true

      - name: 📤 Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: target/dependency-check-report.html
          retention-days: 30
          if-no-files-found: warn
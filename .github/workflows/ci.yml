name: CI - Build and Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build-and-test:
    name: Build and Test Java Application
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 📦 Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 🧹 Clean previous builds
        run: mvn clean

      - name: 🔨 Compile project
        run: mvn compile -DskipTests

      - name: 🧪 Run unit tests (subproject)
        run: mvn -f src/test/SIS/pom.xml test
        continue-on-error: true

      - name: 📊 Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results (${{ matrix.os }})
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          
        - name: 🕵️ Inspect surefire directory
        if: always()
        run: |
          echo "Listing surefire-reports directory:"
          ls -R src/test/SIS/target/surefire-reports || echo "No surefire reports found"


      - name: 📦 Package application
        run: mvn package -DskipTests

      - name: 🔍 Run code quality checks
        if: matrix.os == 'ubuntu-latest'
        run: |
          mvn verify -DskipTests
          mvn checkstyle:checkstyle || true

      - name: 📤 Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.os }}
          path: |
            target/*.jar
            target/*.exe
          retention-days: 7

      - name: 📈 Upload coverage reports
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./src/test/SIS/target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 💬 Comment PR with build status
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const buildStatus = '${{ job.status }}';
            const emoji = buildStatus === 'success' ? '✅' : '❌';
            const comment = `## ${emoji} Build Status - ${{ matrix.os }}
            
            **Status:** ${buildStatus}
            **Java Version:** JDK 21
            **Commit:** ${context.sha.substring(0, 7)}

            [View full workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: comment
            });

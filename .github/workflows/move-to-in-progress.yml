name: Move Issue to In Progress

on:
  create:
    branches:
      - '**'

jobs:
  move-issue:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')
    steps:
      - name: Extract issue number from branch name
        id: extract
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          ISSUE=$(echo "$BRANCH_NAME" | grep -oE '[0-9]+')
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT
          
      - name: Move issue to "In Progress"
        if: steps.extract.outputs.issue != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const issueNumber = ${{ steps.extract.outputs.issue }};
            const projectNumber = 44;
            const organization = "puj-course";
            const targetStatus = "In progress";

            // ==============================
            // 1️⃣ Obtener ID del proyecto y campos
            // ==============================
            const queryProject = `
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    title
                    fields(first: 50) {
                      nodes {
                        __typename
                        ... on ProjectV2Field {
                          id
                          name
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectData = await github.graphql(queryProject, { 
              org: organization, 
              number: projectNumber 
            });
            
            const project = projectData.organization.projectV2;
            const projectId = project.id;
            console.log(`✅ Proyecto encontrado: ${project.title}`);

            // Buscar el campo Status
            const statusField = project.fields.nodes.find(
              f => f.name === "Status" && f.__typename === "ProjectV2SingleSelectField"
            );

            if (!statusField) {
              core.setFailed("❌ Campo 'Status' no encontrado.");
              return;
            }

            const inProgressOption = statusField.options.find(o => o.name === targetStatus);
            if (!inProgressOption) {
              core.setFailed(`❌ Opción '${targetStatus}' no encontrada.`);
              console.log("Opciones disponibles:", statusField.options.map(o => o.name));
              return;
            }

            // ==============================
            // 2️⃣ Obtener el node_id del issue
            // ==============================
            const issueData = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            
            const issueNodeId = issueData.data.node_id;

            // ==============================
            // 3️⃣ Buscar el item en el proyecto
            // ==============================
            const queryItem = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          __typename
                          ... on Issue {
                            id
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const itemsData = await github.graphql(queryItem, { projectId });

            const item = itemsData.node.items.nodes.find(
              i => i.content && i.content.id === issueNodeId
            );

            if (!item) {
              console.log(`⚠️ Issue #${issueNumber} no está en el proyecto.`);
              return;
            }

            // ==============================
            // 4️⃣ Actualizar el estado a "In progress"
            // ==============================
            const mutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            await github.graphql(mutation, {
              projectId: projectId,
              itemId: item.id,
              fieldId: statusField.id,
              optionId: inProgressOption.id
            });

            console.log(`✅ Issue #${issueNumber} movido a '${targetStatus}' exitosamente!`);
name: Move Issue to In Progress

on:
  create:
    branches:
      - '**'

jobs:
  move-issue:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/')
    steps:
      - name: Extract issue number from branch name
        id: extract
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          ISSUE=$(echo "$BRANCH_NAME" | grep -oE '[0-9]+')
          echo "issue=$ISSUE" >> $GITHUB_OUTPUT
          
      - name: Move issue to "In Progress"
        if: steps.extract.outputs.issue != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const issueNumber = ${{ steps.extract.outputs.issue }};
            const projectNumber = 44;
            const organization = "puj-course";
            const targetStatus = "In progress";

            // ==============================
            // 1️⃣ Obtener ID del proyecto y campos
            // ==============================
            const queryProject = `
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                    title
                    fields(first: 50) {
                      nodes {
                        __typename
                        ... on ProjectV2Field {
                          id
                          name
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectData = await github.graphql(queryProject, { 
              org: organization, 
              number: projectNumber 
            });
            
            const project = projectData.organization.projectV2;
            const projectId = project.id;
            console.log(`✅ Proyecto encontrado: ${project.title}`);

            // Buscar el campo Status
            const statusField = project.fields.nodes.find(
              f => f.name === "Status" && f.__typename === "ProjectV2SingleSelectField"
            );

            if (!statusField) {
              core.setFailed("❌ Campo 'Status' no encontrado.");
              return;
            }

            const inProgressOption = statusField.options.find(o => o.name === targetStatus);
            if (!inProgressOption) {
              core.setFailed(`❌ Opción '${targetStatus}' no encontrada.`);
              console.log("Opciones disponibles:", statusField.options.map(o => o.name));
              return;
            }

            // ==============================
            // 2️⃣ Obtener el node_id del issue
            // ==============================
            const issueData = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            
            const issueNodeId = issueData.data.node_id;

            // ==============================
            // 3️⃣ Buscar el item en el proyecto (con paginación)
            // ==============================
            const queryItem = `
              query($projectId: ID!, $cursor: String) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100, after: $cursor) {
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                      nodes {
                        id
                        content {
                          __typename
                          ... on Issue {
                            id
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let projectItems = [];
            let hasNextPage = true;
            let cursor = null;

            // Obtener todos los items con paginación
            while (hasNextPage) {
              const itemsData = await github.graphql(queryItem, { projectId, cursor });
              const items = itemsData.node.items;
              projectItems.push(...items.nodes);
              hasNextPage = items.pageInfo.hasNextPage;
              cursor = items.pageInfo.endCursor;
            }

            console.log(`📊 Total de items en el proyecto: ${projectItems.length}`);

            const item = projectItems.find(
              i => i.content && i.content.id === issueNodeId
            );

            if (!item) {
              console.log(`⚠️ Issue #${issueNumber} no está en el proyecto.`);
              console.log(`📋 Intentando agregarlo automáticamente...`);
              
              try {
                // Agregar el issue al proyecto
                const addItemMutation = `
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: {
                      projectId: $projectId
                      contentId: $contentId
                    }) {
                      item {
                        id
                      }
                    }
                  }
                `;
                
                const addResult = await github.graphql(addItemMutation, {
                  projectId: projectId,
                  contentId: issueNodeId
                });
                
                const newItem = addResult.addProjectV2ItemById.item;
                console.log(`✅ Issue #${issueNumber} agregado al proyecto.`);
                
                // Actualizar el estado
                const mutation = `
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { singleSelectOptionId: $optionId }
                    }) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `;

                await github.graphql(mutation, {
                  projectId: projectId,
                  itemId: newItem.id,
                  fieldId: statusField.id,
                  optionId: inProgressOption.id
                });

                console.log(`✅ Issue #${issueNumber} movido a '${targetStatus}' exitosamente!`);
                return;
                
              } catch (addError) {
                console.log(`❌ No se pudo agregar el issue al proyecto: ${addError.message}`);
                return;
              }
            }

            // ==============================
            // 4️⃣ Actualizar el estado a "In progress"
            // ==============================
            const mutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            await github.graphql(mutation, {
              projectId: projectId,
              itemId: item.id,
              fieldId: statusField.id,
              optionId: inProgressOption.id
            });

            console.log(`✅ Issue #${issueNumber} movido a '${targetStatus}' exitosamente!`);
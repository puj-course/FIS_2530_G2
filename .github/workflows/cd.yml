name: CD - Deploy Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: jar
          - os: windows-latest
            platform: windows
            artifact: exe
          - os: macos-latest
            platform: macos
            artifact: dmg

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}  # ← Usando tu token

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 🔨 Build application
        run: mvn clean package -DskipTests

      - name: 🎨 Build native image (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mvn javafx:jlink || echo "⚠️ jlink not configured, skipping"
          mvn jpackage:jpackage -Djpackage.type=deb || echo "⚠️ jpackage not configured, skipping"
        continue-on-error: true

      - name: 🎨 Build native image (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mvn javafx:jlink || echo "⚠️ jlink not configured, skipping"
          mvn jpackage:jpackage -Djpackage.type=exe || echo "⚠️ jpackage not configured, skipping"
        continue-on-error: true

      - name: 🎨 Build native image (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mvn javafx:jlink || echo "⚠️ jlink not configured, skipping"
          mvn jpackage:jpackage -Djpackage.type=dmg || echo "⚠️ jpackage not configured, skipping"
        continue-on-error: true

      - name: 📦 Prepare distribution
        shell: bash
        run: |
          mkdir -p distribution
          
          # Copiar JARs
          if ls target/*.jar 1> /dev/null 2>&1; then
            cp target/*.jar distribution/ 2>/dev/null || true
            echo "✅ JAR files copied"
          fi
          
          # Copiar instaladores nativos (si existen)
          cp target/*.exe distribution/ 2>/dev/null || true
          cp target/*.deb distribution/ 2>/dev/null || true
          cp target/*.dmg distribution/ 2>/dev/null || true
          
          # Copiar documentación
          cp README.md distribution/ 2>/dev/null || echo "No README.md found"
          cp LICENSE distribution/ 2>/dev/null || echo "No LICENSE found"
          
          echo "📂 Distribution contents:"
          ls -lh distribution/

      - name: 📤 Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: distribution/
          retention-days: 90
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}  # ← Usando tu token
          fetch-depth: 0  # Para git log completo

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 📝 Generate release notes
        id: release_notes
        run: |
          cat > RELEASE_NOTES.md << EOF
          ## 🚀 Release ${GITHUB_REF#refs/tags/}
          
          ### 📦 What's New
          - Spring Boot Application with JavaFX
          - Built with JDK 21
          - Multi-platform support (Windows, Linux, macOS)
          
          ### 📥 Downloads
          Choose the appropriate package for your platform:
          
          **Windows:** \`.jar\` file (run with Java 21)
          **Linux:** \`.jar\` file (run with Java 21)
          **macOS:** \`.jar\` file (run with Java 21)
          
          ### 🔧 Requirements
          - Java 21 or later
          
          ### 📝 Changelog
          $(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD 2>/dev/null || echo "Initial release")
          EOF
          
          {
            echo "notes<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          token: ${{ secrets.GH_TOKEN }}  # ← Usando tu token

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}  # ← Usando tu token

      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: ./release

      - name: 🚀 Deploy to staging server
        run: |
          echo "Deploying to staging environment..."
          echo "📦 Artifacts available:"
          ls -lh release/
          # Aquí agregarías tu lógica de despliegue real
          # Ejemplo: scp, rsync, docker push, etc.

      - name: ✅ Verify deployment
        run: |
          echo "Running smoke tests..."
          # Aquí agregarías pruebas de humo
          # curl -f https://staging.example.com/health || exit 1
          echo "✅ Deployment verified"

      - name: 💬 Notify deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}  # ← Usando tu token
          script: |
            const commit = context.sha.substring(0, 7);
            const message = `🚀 **Staging Deployment Successful**\n\n` +
              `**Commit:** ${commit}\n` +
              `**Environment:** Staging\n` +
              `**Time:** ${new Date().toISOString()}\n` +
              `**Artifacts:** ${Object.keys(context.payload).length} files deployed`;
            
            await github.rest.repos.createCommitComment({
              ...context.repo,
              commit_sha: context.sha,
              body: message
            });

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-release, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://app.example.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}  # ← Usando tu token

      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: ./release

      - name: 🔍 Pre-deployment checks
        run: |
          echo "Running pre-deployment checks..."
          if ls release/*.jar 1> /dev/null 2>&1; then
            echo "✅ JAR file found"
            ls -lh release/*.jar
          else
            echo "❌ No JAR file found"
            exit 1
          fi
          echo "All checks passed!"

      - name: 🚀 Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "📦 Artifacts:"
          ls -lh release/
          # Aquí agregarías tu lógica de despliegue a producción
          # Ejemplo: Kubernetes, AWS, Azure, etc.

      - name: ✅ Verify production deployment
        run: |
          echo "Running production smoke tests..."
          # Pruebas de verificación en producción
          # curl -f https://app.example.com/health || exit 1
          echo "Production deployment verified!"

      - name: 📊 Create deployment record
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}  # ← Usando tu token
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const message = `🎉 **Production Deployment**\n\n` +
              `**Version:** ${tag}\n` +
              `**Environment:** Production\n` +
              `**Deployed at:** ${new Date().toISOString()}\n` +
              `**Status:** ✅ Success`;
            
            await github.rest.repos.createCommitComment({
              ...context.repo,
              commit_sha: context.sha,
              body: message
            });

      - name: 🔔 Notify team
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}  # ← Usando tu token
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // Crear un issue de notificación para el equipo
            await github.rest.issues.create({
              ...context.repo,
              title: `🎉 Production Release ${tag} Deployed`,
              body: `## Production Deployment Successful\n\n` +
                `**Version:** ${tag}\n` +
                `**Deployed at:** ${new Date().toISOString()}\n` +
                `**Commit:** ${context.sha}\n\n` +
                `The application has been successfully deployed to production.\n` +
                `Please verify that everything is working as expected.`,
              labels: ['deployment', 'production', 'release']
            });

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    needs: [deploy-staging, deploy-production]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}  # ← Usando tu token

      - name: 🔄 Rollback to previous version
        run: |
          echo "Rolling back deployment..."
          # Lógica de rollback
          echo "Rollback completed!"

      - name: 🚨 Create incident issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}  # ← Usando tu token
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `🚨 Deployment Failed - ${new Date().toISOString()}`,
              body: `## Deployment Failure\n\n` +
                `**Workflow:** ${context.workflow}\n` +
                `**Run ID:** ${context.runId}\n` +
                `**Commit:** ${context.sha}\n` +
                `**Failed Jobs:** ${needs.deploy-staging.result === 'failure' ? 'Staging' : ''} ` +
                `${needs.deploy-production.result === 'failure' ? 'Production' : ''}\n\n` +
                `Automatic rollback has been initiated.\n` +
                `Please investigate the failure immediately.\n\n` +
                `[View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              labels: ['deployment', 'incident', 'high-priority'],
              assignees: []  // Puedes agregar usuarios específicos aquí
            });

    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: jar
          - os: windows-latest
            platform: windows
            artifact: exe
          - os: macos-latest
            platform: macos
            artifact: dmg

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 🔨 Build application
        run: mvn clean package -DskipTests

      - name: 🎨 Build JavaFX/Spring Boot native image (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Building Linux distribution..."
          # Si tienes jpackage configurado, descomenta:
          # mvn javafx:jlink
          # mvn jpackage:jpackage -Djpackage.type=deb
        continue-on-error: true

      - name: 🎨 Build native image (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Building Windows distribution..."
          # Si tienes jpackage configurado, descomenta:
          # mvn javafx:jlink
          # mvn jpackage:jpackage -Djpackage.type=exe
        continue-on-error: true

      - name: 🎨 Build native image (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "Building macOS distribution..."
          # Si tienes jpackage configurado, descomenta:
          # mvn javafx:jlink
          # mvn jpackage:jpackage -Djpackage.type=dmg
        continue-on-error: true

      - name: 📦 Prepare distribution
        shell: bash
        run: |
          mkdir -p distribution
          
          # Copiar JARs
          if ls target/*.jar 1> /dev/null 2>&1; then
            cp target/*.jar distribution/ 2>/dev/null || true
            echo "✅ JAR files copied"
          fi
          
          # Copiar instaladores nativos (si existen)
          cp target/*.exe distribution/ 2>/dev/null || true
          cp target/*.deb distribution/ 2>/dev/null || true
          cp target/*.dmg distribution/ 2>/dev/null || true
          
          # Copiar documentación
          cp README.md distribution/ 2>/dev/null || echo "No README.md found"
          cp LICENSE distribution/ 2>/dev/null || echo "No LICENSE found"
          
          echo "📂 Distribution contents:"
          ls -lh distribution/

      - name: 📤 Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: distribution/
          retention-days: 90
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4  # ← ACTUALIZADO a v4
        with:
          path: artifacts/

      - name: 📝 Generate release notes
        id: release_notes
        run: |
          cat > RELEASE_NOTES.md << EOF
          ## 🚀 Release ${GITHUB_REF#refs/tags/}
          
          ### 📦 What's New
          - Spring Boot Application with JavaFX
          - Built with JDK 21
          - Multi-platform support (Windows, Linux, macOS)
          
          ### 📥 Downloads
          Choose the appropriate package for your platform:
          
          **Windows:** \`.jar\` file (run with Java 21)
          **Linux:** \`.jar\` file (run with Java 21)
          **macOS:** \`.jar\` file (run with Java 21)
          
          ### 🔧 Requirements
          - Java 21 or later
          
          ### 📝 Changelog
          $(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD 2>/dev/null || echo "Initial release")
          EOF
          
          {
            echo "notes<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> $GITHUB_OUTPUT


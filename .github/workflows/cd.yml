name: CD - Deploy Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: jar
          - os: windows-latest
            platform: windows
            artifact: exe
          - os: macos-latest
            platform: macos
            artifact: dmg

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 🔨 Build application
        run: mvn clean package -DskipTests

      - name: 🎨 Build native image (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mvn javafx:jlink
          mvn jpackage:jpackage -Djpackage.type=deb
        continue-on-error: true

      - name: 🎨 Build native image (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mvn javafx:jlink
          mvn jpackage:jpackage -Djpackage.type=exe
        continue-on-error: true

      - name: 🎨 Build native image (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mvn javafx:jlink
          mvn jpackage:jpackage -Djpackage.type=dmg
        continue-on-error: true

      - name: 📦 Prepare distribution
        run: |
          mkdir -p distribution
          cp target/*.jar distribution/ || true
          cp target/*.exe distribution/ || true
          cp target/*.deb distribution/ || true
          cp target/*.dmg distribution/ || true
          cp README.md distribution/ || true
          cp LICENSE distribution/ || true

      - name: 📤 Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: distribution/
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 📝 Generate release notes
        id: release_notes
        run: |
          cat > RELEASE_NOTES.md << EOF
          ## 🚀 Release ${GITHUB_REF#refs/tags/}
          
          ### 📦 What's New
          - JavaFX Desktop Application
          - Built with JDK 21 and JavaFX SDK 21
          - Multi-platform support (Windows, Linux, macOS)
          
          ### 📥 Downloads
          Choose the appropriate package for your platform:
          
          **Windows:** \`.exe\` installer
          **Linux:** \`.deb\` package or \`.jar\` file
          **macOS:** \`.dmg\` image or \`.jar\` file
          
          ### 🔧 Requirements
          - Java 21 or later (if using .jar files)
          - Native packages include bundled JRE
          
          ### 📝 Changelog
          $(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD)
          EOF
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: ./release

      - name: 🚀 Deploy to staging server
        run: |
          echo "Deploying to staging environment..."
          echo "Artifact: $(ls -lh release/)"
          # Aquí agregarías tu lógica de despliegue real
          # Ejemplo: scp, rsync, docker push, etc.

      - name: ✅ Verify deployment
        run: |
          echo "Running smoke tests..."
          # Aquí agregarías pruebas de humo
          # curl -f https://staging.example.com/health || exit 1

      - name: 💬 Notify deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const commit = context.sha.substring(0, 7);
            const message = `🚀 **Staging Deployment Successful**\n\n` +
              `**Commit:** ${commit}\n` +
              `**Environment:** Staging\n` +
              `**Time:** ${new Date().toISOString()}`;
            
            github.rest.repos.createCommitComment({
              ...context.repo,
              commit_sha: context.sha,
              body: message
            });

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-release, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://app.example.com

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: ./release

      - name: 🔍 Pre-deployment checks
        run: |
          echo "Running pre-deployment checks..."
          # Verificaciones antes de producción
          test -f release/*.jar || exit 1
          echo "All checks passed!"

      - name: 🚀 Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Artifact: $(ls -lh release/)"
          # Aquí agregarías tu lógica de despliegue a producción
          # Ejemplo: Kubernetes, AWS, Azure, etc.

      - name: ✅ Verify production deployment
        run: |
          echo "Running production smoke tests..."
          # Pruebas de verificación en producción
          # curl -f https://app.example.com/health || exit 1
          echo "Production deployment verified!"

      - name: 📊 Create deployment record
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const message = `🎉 **Production Deployment**\n\n` +
              `**Version:** ${tag}\n` +
              `**Environment:** Production\n` +
              `**Deployed at:** ${new Date().toISOString()}\n` +
              `**Status:** ✅ Success`;
            
            github.rest.repos.createCommitComment({
              ...context.repo,
              commit_sha: context.sha,
              body: message
            });

      - name: 🔔 Notify team
        if: success()
        run: |
          echo "Sending notification to team..."
          # Aquí podrías integrar Slack, Discord, Email, etc.
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"Production deployment successful!"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    permissions:
      contents: write
      issues: write   
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    needs: [deploy-staging, deploy-production]

    steps:
      - name: 🔄 Rollback to previous version
        run: |
          echo "Rolling back deployment..."
          # Lógica de rollback
          echo "Rollback completed!"

      - name: 🚨 Create incident issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `🚨 Deployment Failed - ${new Date().toISOString()}`,
              body: `## Deployment Failure\n\n` +
                `**Workflow:** ${context.workflow}\n` +
                `**Run ID:** ${context.runId}\n` +
                `**Commit:** ${context.sha}\n\n` +
                `Automatic rollback has been initiated.\n` +
                `Please investigate the failure.`,
              labels: ['deployment', 'incident', 'high-priority']
            });
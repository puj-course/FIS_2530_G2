name: CD - Deploy Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 🔨 Build application
        run: mvn clean package -DskipTests

      - name: 🧪 Run tests
        run: mvn test

      - name: 📊 Publish Test Results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Maven Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

        - name: 📋 Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/
          retention-days: 30

      - name: 📦 Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 30
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: release-artifacts/

      - name: 📝 Generate release notes
        id: release_notes
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}

          cat > RELEASE_NOTES.md << EOF
          ## 🚀 Release ${TAG_NAME}

          ### 📦 What's New
          - Spring Boot Application with PostgreSQL
          - Built with JDK 21
          - Docker containerized deployment
          - Health monitoring with Spring Boot Actuator

          ### 📥 Downloads
          **JAR File:** \`sis-0.0.1.jar\` - Requires Java 21+
          **Docker:** Available via Docker Hub

          ### 🐳 Docker Deployment
          \`\`\`bash
          docker pull ${{ secrets.DOCKER_USERNAME }}/sis-app:${TAG_NAME}
          docker compose up -d
          \`\`\`

          ### 🔧 Requirements
          - Java 21 or later (for JAR)
          - Docker & Docker Compose (for containers)
          - PostgreSQL 16 (included in docker-compose)

          ### 📝 Changelog
          $(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD 2>/dev/null || echo "Initial release")
          EOF

          {
            echo "notes<<EOF"
            cat RELEASE_NOTES.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.jar
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub (opcional)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/sis-app
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      # url: https://staging.example.com --> none bc we are working on localhost

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker image locally
        run: |
          docker build -t sis-app:staging .

      - name: 🗑️ Clean up existing containers
        run: |
          docker compose down || true
          docker volume prune -f || true

      - name: 🚀 Deploy with Docker Compose
        run: |
          # Crear archivo .env para staging
          cat > .env << EOF
          COMPOSE_PROJECT_NAME=sis-staging
          SPRING_PROFILES_ACTIVE=postgres
          DB_URL=jdbc:postgresql://sis-db:5432/sis
          DB_USER_NAME=postgres
          DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
          POSTGRES_DB=sis
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
          EOF
          
          # Levantar servicios
          docker compose up -d
          
          echo "Esperando a que los servicios estén listos..."
          sleep 30

      - name: ✅ Verify deployment
        run: |
          echo "Verificando el health de la base de datos..."
          docker compose exec -T sis-db pg_isready -U postgres -d sis
          
          echo "Verificando el health de la aplicación..."
          max_attempts=30
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:8080/actuator/health 2>/dev/null; then
              echo "✅ Aplicación está respondiendo correctamente"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Intento $attempt de $max_attempts - Esperando..."
            sleep 10
          done
          
          echo "❌ La aplicación no respondió después de $max_attempts intentos"
          docker compose logs sis-app
          exit 1

      - name: 📊 Show container status
        if: always()
        run: |
          echo "Estado de los contenedores:"
          docker compose ps
          
          echo -e "\n📋 Logs de la aplicación:"
          docker compose logs --tail=50 sis-app
          
          echo -e "\n📋 Logs de la base de datos:"
          docker compose logs --tail=50 sis-db

      - name: 💬 Notify deployment success
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const commit = context.sha.substring(0, 7);
            const message = `🚀 **Staging Deployment Successful**\n\n` +
              `**Commit:** ${commit}\n` +
              `**Environment:** Staging\n` +
              `**Time:** ${new Date().toISOString()}\n` +
              `**Docker Compose:** Services running\n` +
              `- sis-app: ✅\n` +
              `- sis-db: ✅`;
            
            github.rest.repos.createCommitComment({
              ...context.repo,
              commit_sha: context.sha,
              body: message
            });

      - name: 🔄 Cleanup on failure
        if: failure()
        run: |
          echo "Limpiando recursos debido a fallo en el deployment..."
          docker compose down
          docker compose logs

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker-image, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://app.example.com
      # YET TO CHANGE

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker image
        run: |
          docker build -t sis-app:production .

      - name: 🔍 Pre-deployment checks
        run: |
          echo "Ejecutando verificaciones pre-deployment..."
          test -f target/sis-0.0.1.jar || exit 1
          docker images | grep sis-app || exit 1
          echo "✅ Todas las verificaciones pasaron"

      - name: 🚀 Deploy to production
        run: |
          # Crear archivo .env para producción
          cat > .env << EOF
          COMPOSE_PROJECT_NAME=sis-production
          SPRING_PROFILES_ACTIVE=postgres
          DB_URL=jdbc:postgresql://sis-db:5432/sis
          DB_USER_NAME=postgres
          DB_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }}
          POSTGRES_DB=sis
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.PRODUCTION_DB_PASSWORD }}
          EOF
          
          # Backup de la base de datos antes del deployment
          docker compose exec -T sis-db pg_dump -U postgres sis > backup_$(date +%Y%m%d_%H%M%S).sql || true
          
          # Rolling update: levantar nuevos contenedores antes de bajar los viejos
          docker compose up -d --no-deps --build sis-app
          
          echo "Esperando a que los nuevos servicios estén listos..."
          sleep 45

      - name: ✅ Verify production deployment
        run: |
          echo "Verificando deployment en producción..."
          
          # Health check
          max_attempts=30
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:8080/actuator/health 2>/dev/null; then
              echo "✅ Aplicación en producción está respondiendo"
              break
            fi
            attempt=$((attempt + 1))
            echo "Intento $attempt de $max_attempts"
            sleep 10
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Falló la verificación de producción"
            docker compose logs sis-app
            exit 1
          fi
          
          # Verificar conectividad con la base de datos
          docker compose exec -T sis-db pg_isready -U postgres -d sis
          echo "✅ Deployment de producción verificado exitosamente"

      - name: 📊 Create deployment record
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const message = `🎉 **Production Deployment**\n\n` +
              `**Version:** ${tag}\n` +
              `**Environment:** Production\n` +
              `**Deployed at:** ${new Date().toISOString()}\n` +
              `**Status:** ✅ Success\n\n` +
              `**Services:**\n` +
              `- Spring Boot App: ✅\n` +
              `- PostgreSQL 16: ✅`;
            
            github.rest.repos.createCommitComment({
              ...context.repo,
              commit_sha: context.sha,
              body: message
            });

      - name: 🔔 Notify team
        if: success()
        run: |
          echo "📢 Deployment exitoso a producción"
          # Aquí puedes agregar notificaciones a Slack, Discord, etc.

  rollback:
    permissions:
      contents: write
      issues: write   
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    needs: [deploy-staging, deploy-production]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔄 Rollback Docker containers
        run: |
          echo "🔄 Iniciando rollback..."
          
          # Detener contenedores actuales
          docker compose down
          
          # Restaurar imagen anterior (si existe)
          if docker images | grep -q "sis-app:previous"; then
            docker tag sis-app:previous sis-app:latest
            docker compose up -d
            echo "✅ Rollback completado - imagen anterior restaurada"
          else
            echo "⚠️ No se encontró imagen anterior para rollback"
          fi
          
          # Mostrar estado
          docker compose ps
          docker compose logs --tail=50

      - name: 🚨 Create incident issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `🚨 Deployment Failed - ${new Date().toISOString()}`,
              body: `## Deployment Failure\n\n` +
                `**Workflow:** ${context.workflow}\n` +
                `**Run ID:** ${context.runId}\n` +
                `**Commit:** ${context.sha}\n` +
                `**Environment:** ${context.job}\n\n` +
                `### Actions Taken\n` +
                `- ✅ Automatic rollback initiated\n` +
                `- ✅ Previous containers restored\n` +
                `- ⚠️ Manual investigation required\n\n` +
                `### Next Steps\n` +
                `1. Check application logs\n` +
                `2. Verify database connectivity\n` +
                `3. Review recent changes\n` +
                `4. Fix issues and redeploy`,
              labels: ['deployment', 'bug', 'prioridad: muy alta', 'docker']
            });
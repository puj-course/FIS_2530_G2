version: "3.8"

services:
  sis-db:
    image: postgres:16
    container_name: sis_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sis"]
      interval: 10s
      timeout: 5s
      retries: 10

  SIS:
    build: SIS              # ruta donde está tu Dockerfile y código
    container_name: sis_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      sis-db:
        condition: service_healthy

volumes:
  pgdata:
